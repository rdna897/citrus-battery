name: Build and release

on:
  push:
    branches: [main, feature/mac-battery-core]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            launch_check: gui
          - runner: macos-15-intel
            arch: x86_64
            # The hosted Intel VM's virtual GPU can abort in Metal rendering.
            # Exercise the notification startup path without requiring its GPU.
            launch_check: notifications
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Install build tools
        run: brew install librsvg pkgconf
      - name: Cache libraries built for macOS 13
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/deps
          key: deps-${{ matrix.arch }}-${{ hashFiles('scripts/build-dependencies.sh') }}
      - name: Build libimobiledevice for macOS 13
        run: ./scripts/build-dependencies.sh
      - name: Check architecture and Swift toolchain
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
      - name: Test
        run: swift test
      - name: Test updater signatures, installation and relaunch
        if: matrix.launch_check == 'gui'
        run: python3 scripts/test-updater.py
      - name: Package ad hoc signed app and sources
        env:
          BUILD: ${{ github.run_number }}
          CITRUS_LAUNCH_CHECK: ${{ matrix.launch_check }}
        run: ./scripts/package-release.sh
      - name: Sign update archive and feed
        if: github.event_name != 'pull_request'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -n "$SPARKLE_PRIVATE_KEY" ]]; then
            ./scripts/generate-update-feed.sh
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "error: configure the SPARKLE_PRIVATE_KEY repository secret before releasing" >&2
            exit 1
          else
            echo "No updater signing key configured; application artifacts only."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/appcast-*.xml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done
          cd ..
          test -s dist/appcast-arm64.xml
          test -s dist/appcast-x86_64.xml
          flags=()
          if [[ "${GITHUB_REF_NAME#v}" == 0.* || "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 dist/appcast-*.xml \
            --draft \
            --verify-tag --title "Citrus Battery ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE-NOTES.md "${flags[@]}"
          # All archives and signed feeds must be available before this becomes
          # the latest stable release used by installed applications.
          latest=true
          if [[ ${#flags[@]} -gt 0 ]]; then latest=false; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
